[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatifgym"
version = "0.1.0"
description = "Clean-room benchmark and RL environment for LLM what-if agents over optimization models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pulp>=2.8,<4", "highspy>=1.8", "pyscipopt>=5.0", "ortools>=9.10", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["whatifgym*"]

[tool.setuptools.package-data]
whatifgym = ["models/*/data/*.csv", "models/*/*.md", "models/*/*.json", "dsl/*.json", "dsl/*.md", "dsl/examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
